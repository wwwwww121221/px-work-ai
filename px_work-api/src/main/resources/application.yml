server:
  port: ${SERVER_PORT:8082}

app:
  upload-dir: ${APP_UPLOAD_DIR:/app/uploads}

spring:
  application:
    name: px_work-api
  servlet:
    multipart:
      max-file-size: 10240MB
      max-request-size: 10240MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: true
  token-style: uuid

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

ai:
  dify:
    base-url: ${AI_DIFY_BASE_URL:http://192.168.1.51:8099/v1}
    generate-key: ${AI_DIFY_GENERATE_KEY:app-oQqcYxrLtdxuX5CoBTcDoFGg}
    grade-key: ${AI_DIFY_GRADE_KEY:app-2YRW4daPCMB7oPc4wZ8yC1Qb}

minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.1.51:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://192.168.1.51:9000}}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:admin123456}
  bucket-name: ${MINIO_BUCKET_NAME:px-work}

logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG

trtc:
  appid: 1600135547
  secret-key: "48cd6305f31e1a916ad6dc792ef8c93b3dd746141765d43d159e9d15de38c63b"
  expire-time: 86400
